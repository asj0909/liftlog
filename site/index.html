<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiftLog</title>
<meta name="description" content="筋トレ記録アプリ LiftLog のサポートページ">
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0b6bcb;--note:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#4493f8;--note:#151b23}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;line-height:1.4;margin:0 0 4px}
h2{font-size:1.15rem;margin:32px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
p,li{font-size:1rem}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 24px}
.note{background:var(--note);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
a{color:var(--accent)}
nav{font-size:.9rem;margin-bottom:24px}
nav a{margin-right:16px}
footer{margin-top:48px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
<nav><a href="./">LiftLog</a><a href="privacy.html">プライバシーポリシー</a><a href="delete-account.html">アカウント削除</a></nav>

<h1>LiftLog - 筋トレ記録</h1>
<p class="meta">筋トレの重量・回数を記録し、推移をグラフで確認できるアプリです。</p>
<p id="auth-result" class="note" hidden></p>
<h2>サポート</h2>
<ul>
<li><a href="privacy.html">プライバシーポリシー</a></li>
<li><a href="delete-account.html">アカウントとデータの削除</a></li>
</ul>
<h2>お問い合わせ</h2>
<p>メール：<a href="mailto:forthegpking02@gmail.com">forthegpking02@gmail.com</a></p>

<footer>LiftLog - 筋トレ記録 / 開発者：gp_sensei</footer>
</main>
<script>
// 認証メール（登録確認など）のリンクから来たときに結果を表示する。
// Supabase は確認後に Site URL（このページ）へ ?code= または #error= を付けて戻す
(function () {
  var query = new URLSearchParams(location.search);
  var hash = new URLSearchParams(location.hash.slice(1));
  var box = document.getElementById('auth-result');
  var message = null;
  if (query.get('error') || hash.get('error')) {
    message = 'リンクの有効期限が切れているか、すでに使われています。アプリからもう一度お試しください。';
  } else if (query.get('code')) {
    message = 'メールアドレスの確認が完了しました。アプリに戻ってログインしてください。';
  }
  if (message === null) return;
  box.textContent = message;
  box.hidden = false;
  // コードやエラーを URL に残さない
  history.replaceState(null, '', location.pathname);
})();
</script>
</body>
</html>
