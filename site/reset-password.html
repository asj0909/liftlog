<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>パスワードの再設定 | LiftLog</title>
<meta name="description" content="LiftLog のパスワードを再設定します">
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0b6bcb;--note:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#4493f8;--note:#151b23}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;line-height:1.4;margin:0 0 4px}
h2{font-size:1.15rem;margin:32px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
p,li{font-size:1rem}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 24px}
.note{background:var(--note);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
a{color:var(--accent)}
nav{font-size:.9rem;margin-bottom:24px}
nav a{margin-right:16px}
footer{margin-top:48px;color:var(--muted);font-size:.85rem}
form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
label{font-size:.9rem;color:var(--muted)}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.error{color:#cf222e}
@media (prefers-color-scheme:dark){.error{color:#ff7b72}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>パスワードの再設定</h1>
<p class="meta">LiftLog - 筋トレ記録</p>

<p id="status">確認しています…</p>

<form id="form" hidden novalidate>
  <label for="password">新しいパスワード（8 文字以上）</label>
  <input id="password" type="password" autocomplete="new-password" minlength="8" required>
  <label for="confirm">確認のため、もう一度</label>
  <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
  <p id="error" class="error" role="alert" hidden></p>
  <button id="submit" type="submit">パスワードを変更する</button>
</form>

<div id="done" class="note" hidden>
  <p id="done-message">パスワードを変更しました。LiftLog アプリに戻り、新しいパスワードでログインしてください。</p>
</div>

<footer>LiftLog - 筋トレ記録</footer>
</main>

<script src="supabase-config.js"></script>
<!-- バージョンを固定し、SRI で中身が変わっていないことを確認する -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const form = document.getElementById('form');
  const error = document.getElementById('error');
  const submit = document.getElementById('submit');
  const done = document.getElementById('done');
  const doneMessage = document.getElementById('done-message');

  const fail = (message) => { status.textContent = message; status.className = 'error'; form.hidden = true; };
  const showError = (message) => { error.textContent = message; error.hidden = false; };
  const expired = 'リンクの有効期限が切れているか、すでに使われています。アプリの「パスワードを忘れた方」から、もう一度メールを送ってください。';

  if (typeof supabase === 'undefined' || !window.LIFTLOG_SUPABASE) {
    fail('ページを読み込めませんでした。通信環境を確認して、メールのリンクをもう一度開いてください。');
    return;
  }

  // メールのリンク：reset-password.html#token_hash=...&type=recovery（Supabase のメールテンプレートで設定）
  // トークンはフラグメント（#）に置くので、サーバーのアクセスログや Referer には送られない
  const params = new URLSearchParams(location.hash.slice(1));
  const tokenHash = params.get('token_hash');
  const type = params.get('type');
  // アドレスバーや履歴にトークンを残さない
  history.replaceState(null, '', location.pathname);
  if (!tokenHash || type !== 'recovery') {
    fail('リンクが正しくありません。アプリの「パスワードを忘れた方」から、もう一度メールを送ってください。');
    return;
  }

  const config = window.LIFTLOG_SUPABASE;
  const client = supabase.createClient(config.url, config.publishableKey, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  });

  // ページを開いただけではトークンを使わない（メールのセキュリティ検査がリンクを先読みしても無効にならないように）。
  // 「変更する」を押したときに確認と変更をまとめて行う
  let verified = false;
  status.textContent = '新しいパスワードを入力してください。';
  form.hidden = false;

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    error.hidden = true;
    if (password.length < 8) {
      showError('パスワードは 8 文字以上で入力してください。');
      return;
    }
    if (password !== confirm) {
      showError('2 つのパスワードが一致しません。');
      return;
    }

    submit.disabled = true;
    if (!verified) {
      // トークンを確認して、一時的にログインした状態にする（トークンは 1 回しか使えない）
      const { error: verifyError } = await client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      if (verifyError) {
        fail(expired);
        return;
      }
      verified = true;
    }

    const { error: updateError } = await client.auth.updateUser({ password });
    if (updateError) {
      // 確認済みのセッションはこのページ内に残っているので、入力を直して再度押せる
      showError('パスワードを変更できませんでした（' + updateError.message + '）。');
      submit.disabled = false;
      return;
    }

    // このページのセッションは不要なので破棄する（アプリのログイン状態には影響しない）
    const { error: signOutError } = await client.auth.signOut({ scope: 'local' });
    form.hidden = true;
    status.hidden = true;
    if (signOutError) {
      doneMessage.textContent = 'パスワードは変更しました。このページの後片付けに失敗したため、このページ（タブ）を閉じてから、LiftLog アプリで新しいパスワードを使ってログインしてください。';
    }
    done.hidden = false;
  });
})();
</script>
</body>
</html>
