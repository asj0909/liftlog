name: liftlog
description: 筋トレ記録アプリ LiftLog（Android / iOS / Web）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# 依存パッケージは tool/setup.sh の `flutter pub add` で追加する。
# （実行時点の最新の互換バージョンが自動で記録される）
dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  supabase_flutter: ^2.18.3
  table_calendar: ^3.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
