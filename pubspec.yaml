name: liftlog
description: 筋トレ記録アプリ LiftLog（Android / iOS / Web）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# 依存パッケージは tool/setup.sh の `flutter pub add` で追加する。
# （実行時点の最新の互換バージョンが自動で記録される）
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
