name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# アクションはタグではなくコミット SHA で固定する（タグの付け替えによる差し替えを防ぐ）
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # flutter-action のキャッシュは内部でタグ指定の actions/cache を使うため無効にする
          cache: false

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Android のビルドが通ること（Gradle・署名設定・マニフェストの変更を PR で確認する）
  # android/key.properties はないので release でも debug 署名にフォールバックする
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # flutter-action のキャッシュは内部でタグ指定の actions/cache を使うため無効にする
          cache: false

      - run: flutter pub get
      - run: flutter build apk --release
